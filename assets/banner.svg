<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Abliterated AI API on Muapi</title>
  <desc id="desc">A dark violet developer banner with a connected model graph and API request card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101126"/>
      <stop offset="1" stop-color="#26154f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70e1ff"/>
      <stop offset="1" stop-color="#b879ff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1440" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1240" cy="55" r="145" fill="#854dff" opacity=".24" filter="url(#blur)"/>
  <circle cx="1060" cy="330" r="150" fill="#24c8e8" opacity=".15" filter="url(#blur)"/>
  <g opacity=".2" stroke="#c4b5fd" stroke-width="1">
    <path d="M830 48h520M830 88h520M830 128h520M830 168h520M830 208h520M830 248h520M830 288h520"/>
    <path d="M870 20v300M930 20v300M990 20v300M1050 20v300M1110 20v300M1170 20v300M1230 20v300M1290 20v300M1350 20v300"/>
  </g>
  <text x="86" y="102" fill="#b5c8ff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">MUAPI · LANGUAGE MODEL API</text>
  <text x="82" y="174" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="750">Abliterated AI API</text>
  <text x="86" y="220" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="22">21 model routes · one key · REST + streaming</text>
  <rect x="86" y="259" width="330" height="44" rx="22" fill="#ffffff" opacity=".1" stroke="#b8a3ff"/>
  <text x="108" y="287" fill="#e9ddff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">POST /api/v1/{model-id}</text>
  <g transform="translate(905 82)">
    <rect width="435" height="196" rx="18" fill="#0e1023" opacity=".88" stroke="#7065a9"/>
    <circle cx="24" cy="25" r="5" fill="#ff7188"/><circle cx="43" cy="25" r="5" fill="#ffcb6b"/><circle cx="62" cy="25" r="5" fill="#5cdb9a"/>
    <text x="24" y="67" fill="#80ddff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">{ "model": "qwen-3-8-27b",</text>
    <text x="24" y="97" fill="#bdadff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">  "prompt": "...",</text>
    <text x="24" y="127" fill="#bdadff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">  "max_tokens": 512 }</text>
    <path d="M24 157h170" stroke="url(#glow)" stroke-width="4" stroke-linecap="round"/>
    <text x="212" y="164" fill="#95a1bd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">request_id → result</text>
  </g>
</svg>
